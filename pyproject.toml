[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A small programming agent built on OpenAI-compatible native tool calling"
readme = "README.txt"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
